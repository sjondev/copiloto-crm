# Esteira base: compila e testa. Os gates especializados (segredo #47, KISS/DRY
# #75) sao workflows proprios e assumem este aqui de pe.
#
# Sem Postgres no job de proposito: a suite roda offline por decisao
# (MODEL_PROVIDER=fake, CONVERSATION_SOURCE=fake). Servico so entra junto com o
# primeiro teste de integracao que precisar dele.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# O minimo. Workflow com permissao de escrita e superficie de ataque a toa.
permissions:
  contents: read

# Push seguido no mesmo PR nao precisa de duas maquinas: a execucao anterior
# vira resultado velho no instante em que a nova comeca.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-teste:
    name: Build e teste
    runs-on: ubuntu-latest
    # Job travado nao pode queimar minuto ate o teto da conta.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o SDK
        uses: actions/setup-dotnet@v4
        with:
          # Mesma faixa do desenvolvimento (9.0.203). Esteira compilando com SDK
          # diferente do da maquina e verde que nao vale nada.
          dotnet-version: '9.0.x'

      # A chave e o Directory.Packages.props porque e la que a versao mora — o
      # gerenciamento central de pacote tirou o numero de dentro dos .csproj.
      - name: Cache de pacote NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release --nologo

      - name: Testar
        run: dotnet test --no-build --configuration Release --nologo

  # O front tem esteira propria e nao depende do backend: sao dois artefatos
  # independentes, e encadea-los faria um erro de CSS segurar o merge de uma
  # correcao de dominio.
  front:
    name: Front
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          # Mesma faixa do desenvolvimento (24.15.0).
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` e nao `npm install`: instala EXATAMENTE o lock, e falha se o
      # package.json divergir dele. Install resolveria a divergencia em silencio
      # e a esteira passaria a testar arvore diferente da do desenvolvedor.
      - name: Instalar
        run: npm ci

      # `build` roda `tsc --noEmit` antes do bundle, entao erro de tipo reprova
      # aqui e nao vira defeito de runtime na tela do vendedor.
      - name: Compilar
        run: npm run build

      # O Storybook compila junto (#170). Story so vale enquanto acompanha o
      # componente: sem isto, um estado que deixou de existir continuaria
      # listado, e alguem olharia uma tela que o produto nao tem mais.
      - name: Compilar o Storybook
        run: npm run build-storybook
